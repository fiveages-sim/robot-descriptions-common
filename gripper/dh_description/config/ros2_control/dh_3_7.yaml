# DH-3-7 standalone: angles in radians; no unvalidated open/close presets.
controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    hand_joint_controller:
      type: basic_joint_controller/BasicJointController
joint_state_broadcaster:
  ros__parameters:
    joints:
    - thumb_joint1
    - thumb_joint2
    - thumb_joint3
    - index_joint1
    - index_joint2
    - middle_joint1
    - middle_joint2
    interfaces:
    - position
    - velocity
    - effort
hand_joint_controller:
  ros__parameters:
    update_rate: 50
    joints:
    - thumb_joint1
    - thumb_joint2
    - thumb_joint3
    - index_joint1
    - index_joint2
    - middle_joint1
    - middle_joint2
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    target_command_enabled: false
    home_1:
    - 0.0
    - 1.0
    - 2.0
    - 1.0
    - 2.0
    - 1.0
    - 2.0
    home_2:
    - 0.0
    - 1.87
    - 1.7
    - 1.87
    - 1.7
    - 1.87
    - 1.7
    home_interpolation_type: none
    movej_interpolation_type: none
    home_duration: 0.01
    movej_duration: 0.01
    hold_position_threshold: 0.01
