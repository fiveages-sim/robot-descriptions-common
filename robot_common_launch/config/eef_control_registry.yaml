# Maps end-effector type keys to controller side templates in robot-descriptions-common.
# Template paths are relative to the package share root.
#
# Grippers following {side_}gripper_joint use _defaults.gripper automatically.
# Per-type controller params come from the robot package ros2_control/<type>.yaml
# (or common.yaml) during asymmetric compose — no registry entry needed.
#
# Passive end effectors (e.g. suction_cup) have no ros2_control joints — omit from registry.
# Register a type here only for actuated non-gripper templates (dexterous hands, etc.).

_defaults:
  gripper:
    package: robot_common_launch
    template: config/ros2_control/templates/gripper.side.yaml
    category: gripper

linkerhand_o6:
  package: linkerhand_description
  template: config/ros2_control/templates/o6.side.yaml
  category: hand

linkerhand_l6:
  package: linkerhand_description
  template: config/ros2_control/templates/l6.side.yaml
  category: hand

linkerhand_o7:
  package: linkerhand_description
  template: config/ros2_control/templates/o7.side.yaml
  category: hand

freedom_v1:
  package: freedom_description
  template: config/ros2_control/templates/freedom.side.yaml
  category: hand

freedom_v2:
  package: freedom_description
  template: config/ros2_control/templates/freedomv2.side.yaml
  category: hand

inspire_e2:
  package: inspire_description
  template: config/ros2_control/templates/rh56e2.side.yaml
  category: hand

inspire_f2:
