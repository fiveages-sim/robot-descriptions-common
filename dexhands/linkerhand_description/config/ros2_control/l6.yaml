# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_joint_controller:
      type: basic_joint_controller/BasicJointController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - thumb_joint1
      - thumb_joint2
      - index_joint
      - middle_joint
      - ring_joint
      - pinky_joint
    interfaces:
      - position
      - velocity
      - effort

hand_joint_controller:
  ros__parameters:
    update_rate: 50  # Hz
    movej_interpolation_type: "None"
    home_interpolation_type: "None"
    # 7个主控关节
    joints:
      - thumb_joint1
      - thumb_joint2
      - index_joint
      - middle_joint
      - ring_joint
      - pinky_joint
    
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    
    # Home 配置（需要根据实际情况调整）
    home_1: [0.0, 1.39, 0.0, 0.0, 0.0, 0.0]
    home_2: [0.6, 1.39, 0.5, 0.5, 0.5, 0.5]
    
    home_duration: 0.2
    movej_duration: 0.2
    hold_position_threshold: 0.1
